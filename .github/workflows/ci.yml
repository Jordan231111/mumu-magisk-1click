name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  smoke-tests:
    name: Smoke tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify committed installer
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy RemoteSigned -File .\scripts\Update-MuMuInstaller.ps1 -VerifyOnly
          if ($LASTEXITCODE -ne 0) { throw 'Committed installer verification failed.' }

      - name: Run regression suites
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy RemoteSigned -File .\tests\Run.Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Regression suites failed.' }
