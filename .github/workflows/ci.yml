name: CI

on:
  workflow_dispatch:
    inputs:
      update_installer:
        description: 'Download the current Global installer and open a PR if the committed EXE changed'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '17 8 * * 1'
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  resolve-global-installer:
    name: Resolve Global installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve Global download URL
        shell: powershell
        env:
          ALLOW_STALE_INSTALLER: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.update_installer == true) }}
        run: |
          $json = & powershell.exe -NoProfile -ExecutionPolicy RemoteSigned -File .\scripts\MuMuConfig.ps1 -Action ResolveDownload --json
          if ($LASTEXITCODE -ne 0) {
            throw "ResolveDownload failed: $json"
          }

          $info = $json | ConvertFrom-Json
          if ($info.final_url -notmatch '^https://a11\.gdl\.netease\.com/.*\.exe(\?|$)') {
            throw "Unexpected Global installer URL: $($info.final_url)"
          }
          if (@($info.status_chain) -notcontains 302 -or @($info.status_chain) -notcontains 200) {
            throw "Unexpected status chain: $($info.status_chain -join ' -> ')"
          }
          if (-not (Test-Path -LiteralPath .\MuMuInstaller_Global.exe -PathType Leaf)) {
            throw "MuMuInstaller_Global.exe is missing from the repo."
          }

          $committed = Get-Item -LiteralPath .\MuMuInstaller_Global.exe
          $requireCurrentInstaller = $env:ALLOW_STALE_INSTALLER -ne 'true'
          if ($requireCurrentInstaller -and $committed.Length -ne [int64]$info.content_length) {
            throw "Committed installer size is stale. Expected $($info.content_length), got $($committed.Length). Run DownloadInstaller and commit the new EXE."
          }

          $committedMd5 = (Get-FileHash -LiteralPath .\MuMuInstaller_Global.exe -Algorithm MD5).Hash.ToLowerInvariant()
          if ($requireCurrentInstaller -and $info.final_md5_hex -and $committedMd5 -ne $info.final_md5_hex.ToLowerInvariant()) {
            throw "Committed installer MD5 is stale. Expected $($info.final_md5_hex), got $committedMd5. Run DownloadInstaller and commit the new EXE."
          }

          $tempExe = Join-Path $env:RUNNER_TEMP 'MuMuInstaller_Global.exe'
          $tempMetadata = Join-Path $env:RUNNER_TEMP 'installer-url.txt'
          $downloadJson = & powershell.exe -NoProfile -ExecutionPolicy RemoteSigned -File .\scripts\MuMuConfig.ps1 -Action DownloadInstaller --output $tempExe --metadata $tempMetadata --json
          if ($LASTEXITCODE -ne 0) {
            throw "DownloadInstaller failed: $downloadJson"
          }
          $download = $downloadJson | ConvertFrom-Json
          if ($info.final_md5_hex -and $download.md5 -ne $info.final_md5_hex.ToLowerInvariant()) {
            throw "Downloaded installer does not match MuMu metadata. Downloaded $($download.md5), expected $($info.final_md5_hex)."
          }
          if ($requireCurrentInstaller -and $download.md5 -ne $committedMd5) {
            throw "Downloaded installer does not match committed installer. Downloaded $($download.md5), committed $committedMd5."
          }

          "### Global MuMu installer" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "- Metadata version: $($info.metadata_version)" >> $env:GITHUB_STEP_SUMMARY
          "- Metadata update time: $($info.metadata_update_time_utc)" >> $env:GITHUB_STEP_SUMMARY
          "- Filename: $($info.filename)" >> $env:GITHUB_STEP_SUMMARY
          "- Content-Length: $($info.content_length)" >> $env:GITHUB_STEP_SUMMARY
          "- MD5: $committedMd5" >> $env:GITHUB_STEP_SUMMARY
          "- Status chain: $($info.status_chain -join ' -> ')" >> $env:GITHUB_STEP_SUMMARY
          "- Final URL: $($info.final_url)" >> $env:GITHUB_STEP_SUMMARY

  smoke-tests:
    name: Smoke tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run smoke tests
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy RemoteSigned -File .\tests\Smoke.Tests.ps1

  update-installer-pr:
    name: Update installer branch
    runs-on: windows-latest
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.update_installer == true) }}
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for installer update
        id: installer
        shell: powershell
        run: |
          $tempExe = Join-Path $env:RUNNER_TEMP 'MuMuInstaller_Global.exe'
          $tempMetadata = Join-Path $env:RUNNER_TEMP 'installer-url.txt'
          $json = & powershell.exe -NoProfile -ExecutionPolicy RemoteSigned -File .\scripts\MuMuConfig.ps1 -Action DownloadInstaller --output $tempExe --metadata $tempMetadata --json
          if ($LASTEXITCODE -ne 0) {
            throw "DownloadInstaller failed: $json"
          }

          $download = $json | ConvertFrom-Json
          $committedMd5 = ''
          if (Test-Path -LiteralPath .\MuMuInstaller_Global.exe -PathType Leaf) {
            $committedMd5 = (Get-FileHash -LiteralPath .\MuMuInstaller_Global.exe -Algorithm MD5).Hash.ToLowerInvariant()
          }
          $binaryChanged = $download.md5 -ne $committedMd5

          $metadataChanged = -not (Test-Path -LiteralPath .\installer-url.txt -PathType Leaf)
          if (-not $metadataChanged) {
            $newMetadataSha256 = (Get-FileHash -LiteralPath $tempMetadata -Algorithm SHA256).Hash
            $committedMetadataSha256 = (Get-FileHash -LiteralPath .\installer-url.txt -Algorithm SHA256).Hash
            $metadataChanged = $newMetadataSha256 -ne $committedMetadataSha256
          }

          if (-not $binaryChanged -and -not $metadataChanged) {
            "changed=false" >> $env:GITHUB_OUTPUT
            "### Global MuMu installer update" >> $env:GITHUB_STEP_SUMMARY
            "" >> $env:GITHUB_STEP_SUMMARY
            "No installer or metadata change detected." >> $env:GITHUB_STEP_SUMMARY
            "- MD5: $committedMd5" >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          if ($binaryChanged) {
            Copy-Item -LiteralPath $tempExe -Destination .\MuMuInstaller_Global.exe -Force
          }
          if ($metadataChanged) {
            Copy-Item -LiteralPath $tempMetadata -Destination .\installer-url.txt -Force
          }

          "changed=true" >> $env:GITHUB_OUTPUT
          "md5=$($download.md5)" >> $env:GITHUB_OUTPUT
          "### Global MuMu installer update" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "Installer or metadata changed; an update branch will be pushed." >> $env:GITHUB_STEP_SUMMARY
          "- Binary changed: $binaryChanged" >> $env:GITHUB_STEP_SUMMARY
          "- Metadata changed: $metadataChanged" >> $env:GITHUB_STEP_SUMMARY
          "- Old MD5: $committedMd5" >> $env:GITHUB_STEP_SUMMARY
          "- New MD5: $($download.md5)" >> $env:GITHUB_STEP_SUMMARY

      - name: Push update branch
        if: steps.installer.outputs.changed == 'true'
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B automation/update-global-mumu-installer
          git add MuMuInstaller_Global.exe installer-url.txt
          git commit -m "Update Global MuMu installer"
          git push --force-with-lease origin automation/update-global-mumu-installer

          "Pushed branch: automation/update-global-mumu-installer" >> $env:GITHUB_STEP_SUMMARY

      - name: Open update pull request
        if: steps.installer.outputs.changed == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $branch = 'automation/update-global-mumu-installer'
          $existing = gh pr list --head $branch --base main --json number --jq '.[0].number'
          if ($existing) {
            "Pull request already open: #$existing" >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          gh pr create `
            --base main `
            --head $branch `
            --title "Update Global MuMu installer" `
            --body "Updates MuMuInstaller_Global.exe and installer-url.txt from MuMu's official Global download API."

          "Opened pull request for branch: $branch" >> $env:GITHUB_STEP_SUMMARY
